[package]
name = "icp-cli-network-launcher"
version = "16.1.0-2026-10-16-03-29"
edition = "2024"
authors = ["DFINITY Stiftung <sdk@dfinity.org>"]
license = "Apache-2.0"

[features]
cloud-engine = []

[dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
camino = "1.2.2"
clap = { version = "4.5.53", features = ["derive", "env"] }
hex = "0.4.3"
ic_principal = "0.1.1"
notify = "8.2.0"
pocket-ic = { git = "https://github.com/dfinity/ic", rev = "661a9806c9eef7106475c396e6348fba63e74066" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "signal"] }
