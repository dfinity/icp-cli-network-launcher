name: Update Rust Toolchain

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Rust version to pin (e.g. 1.97.0). Leave blank to use the latest stable.'
        required: false
        default: ''

jobs:
  update-toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run update script
        id: update
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            ./scripts/update-rust-toolchain.sh "${{ inputs.version }}"
          else
            ./scripts/update-rust-toolchain.sh
          fi

          if git diff --quiet; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            NEW_VERSION=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App Token
        if: steps.update.outputs.needs_update == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}

      - name: Open pull request
        if: steps.update.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="chore/update-rust-toolchain"
          TITLE="chore(toolchain): update Rust to ${{ steps.update.outputs.new_version }}"
          BODY="Updates the pinned Rust toolchain and Docker base images to \`${{ steps.update.outputs.new_version }}\`."

          git config user.name "pr-automation-bot-public[bot]"
          git config user.email "pr-automation-bot-public[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add rust-toolchain.toml Dockerfile cloudengine.Dockerfile
          git commit -m "$TITLE"
          git push origin "$BRANCH" --force

          gh pr create --title "$TITLE" --body "$BODY" --base main --head "$BRANCH" \
            || echo "PR already open on $BRANCH, branch updated."
