name: CI
on:
  pull_request:
  # setup-rust-toolchain below runs Swatinem/rust-cache internally (its `cache`
  # input defaults to true), and a PR can only restore from caches created on its
  # base branch — so build main too, or every PR job starts from an empty cache.
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      - name: Check format
        run: cargo fmt -- --check
      # --all-targets so the test code is linted too.
      - name: Run clippy
        run: cargo clippy --all-targets -- -Dwarnings

  test:
    name: cargo test
    # Mirrors the platforms release.yml ships; the tests themselves are unix-only.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The rust-cache that setup-rust-toolchain runs internally folds every
      # installed toolchain's version into its cache key, and the runner image's
      # bundled `stable` drifts as the image updates, which would miss the cache
      # every run. Leave only the rust-toolchain.toml-pinned version.
      - name: Remove pre-installed Rust stable toolchain
        run: rustup toolchain remove stable 2>/dev/null || true

      # No explicit `toolchain` — uses the channel from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      # The tests drive the launcher against a fake pocket-ic server, so there is
      # no pocket-ic binary to download. --locked fails on a stale Cargo.lock
      # rather than silently testing a different dependency graph than the
      # committed one, which is what the release build uses.
      - name: Run tests
        run: cargo test --locked

  aggregate:
    # Named for the repo's required status check, not for what it gates: renaming
    # it would leave `lint:required` permanently pending and block every merge.
    # It now covers the tests too, despite the name. To rename, update the branch
    # ruleset's required checks first.
    name: lint:required
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: ${{ always() }}
    steps:
      - if: ${{ needs.lint.result != 'success' }}
        run: exit 1
      - if: ${{ needs.test.result != 'success' }}
        run: exit 1
